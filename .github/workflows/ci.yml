name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: 22.12.0

jobs:
  # lint / typecheck / test 与平台无关，用 ubuntu 跑（比 macOS runner 快且不占用配额倍率）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx eslint src/ electron/ --max-warnings 0
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: TypeScript src/
        run: npx tsc --noEmit -p tsconfig.json
      - name: TypeScript electron/
        run: npx tsc --noEmit -p electron/tsconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx vitest run
        continue-on-error: true

  # 编译冒烟：验证三平台都能产出 CLI + 渲染层 + 主进程，但不打包安装器
  build:
    name: Build check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
            cli_archs: --arch=x64 --arch=arm64
          - platform: win
            os: windows-latest
            cli_archs: --arch=x64 --arch=arm64 --arch=ia32
          - platform: linux
            os: ubuntu-latest
            cli_archs: --arch=x64 --arch=arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 版本跟随 engine/go.mod，避免与 go 指令声明的版本脱节
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - run: npm ci --ignore-scripts

      - name: Clean stale CLI binaries
        shell: bash
        run: rm -rf build/ainovel-cli

      - name: Build ainovel-cli (per arch)
        run: node scripts/build-cli.cjs ${{ matrix.cli_archs }} --no-upx

      - name: Build renderer & electron main
        run: npm run build:renderer && npm run build:electron
